apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: sample-app-canary
  namespace: carf-test
  labels:
    app.kubernetes.io/part-of: carf
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-k8s-app
  service:
    port: 8080
    targetPort: 8080
  analysis:
    interval: 10s
    threshold: 3
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 30s
