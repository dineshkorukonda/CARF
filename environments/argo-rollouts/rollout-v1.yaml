apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sample-argo-rollout
  namespace: carf-test
  labels:
    app: sample-argo-rollout
    version: v1
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 15s }
        - setWeight: 50
        - pause: { duration: 15s }
  selector:
    matchLabels:
      app: sample-argo-rollout
  template:
    metadata:
      labels:
        app: sample-argo-rollout
        version: v1
    spec:
      containers:
        - name: app
          image: carf-sample-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "v1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
