apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-k8s-app
  namespace: carf-test
  labels:
    app: sample-k8s-app
    version: broken
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sample-k8s-app
  template:
    metadata:
      labels:
        app: sample-k8s-app
        version: broken
    spec:
      containers:
        - name: app
          image: carf-sample-app:broken
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "broken"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
