name: agent CI
on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm test
